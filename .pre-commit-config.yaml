# Local hooks mirroring the CI pipeline exactly (pinned ruff version, dash
# byte scan). Install once inside a throwaway venv:
#   python -m pip install pre-commit "ruff==0.15.8" && pre-commit install
# The hooks run the same commands CI runs; keep them in sync.
repos:
- repo: local
  hooks:
  - id: ruff-pinned
    name: ruff check (pin 0.15.8, same paths as CI)
    entry: ruff check g2h.py runalerts/ tests/
    language: system
    pass_filenames: false
    types_or: [python]
  - id: no-em-en-dashes
    name: byte scan tracked files for U+2014 / U+2013
    entry: python .github/scripts/dash_scan.py
    language: system
    pass_filenames: false
    always_run: true
