# Continuous integration: lint, unit tests with the mock gateway, a byte
# scan for em/en dashes on every tracked file, and a full-history secret
# scan. Every "uses:" step is pinned to a full 40-char commit SHA with the
# resolved tag named in a comment (no floating @vN refs, no secrets here).
# The lint pip install runs with --require-hashes against the hash-locked
# closure in requirements-ruff.txt, generated from requirements-ruff.in
# with pip-compile --generate-hashes.

name: ci

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: the workflow token gets contents read only; the single
# widened scope (pull-requests write) is granted on the gitleaks job alone,
# because gitleaks-action comments on PRs when a pull_request scan finds a leak.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install hash-locked ruff (development-only linter)
        run: python -m pip install --require-hashes -r requirements-ruff.txt
      - name: Lint client, sender and tests (rules E, F, W)
        run: ruff check g2h.py runalerts/ tests/

  test:
    strategy:
      fail-fast: false
      matrix:
        # ubuntu-latest (26.04) ships no CPython 3.9 builds in setup-python,
        # so the 3.9 leg is pinned to ubuntu-22.04 where builds exist.
        include:
          - os: ubuntu-22.04
            python-version: "3.9"
          - os: ubuntu-latest
            python-version: "3.12"
          - os: macos-latest
            python-version: "3.9"
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.9"
          - os: windows-latest
            python-version: "3.12"
    runs-on: ${{ matrix.os }}
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run the unittest suite against the mock gateway
        run: python -m unittest discover -s tests -v

  dash-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Byte scan every tracked file for U+2014 and U+2013
        run: python3 .github/scripts/dash_scan.py

  secrets:
    runs-on: ubuntu-latest
    permissions:
      # A job-level block replaces the inherited workflow set, so contents read
      # is restated for the fetch-depth 0 checkout. pull-requests write exists
      # only because gitleaks-action v2.3.9 (GITLEAKS_ENABLE_COMMENTS defaults
      # true) POSTs a PR review comment via the Octokit pulls API when a
      # pull_request scan finds a leak.
      contents: read
      pull-requests: write
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
      - name: Gitleaks full-history scan (default rules, empty allowlist)
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
